name: Build and test
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: ./build.sh
      - name: Test local reader
        run: python3 Tests/check_reader.py
      - name: Test live state reducer
        run: Tests/check_live_state.sh
      - name: Test multi-display alert placement
        run: Tests/check_alert_placement.sh
      - name: Test monitor lifecycle
        run: Tests/check_monitor_flow.sh
      - name: Check release website gating
        run: python3 Tests/check_release_preparation.py
      - name: Verify signature
        run: codesign --verify --strict Mote.app
